services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coding_agent
      MYSQL_USER: coding_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coding_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "../docs/sql:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd-data:/etcd"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address :9001
    volumes: ["minio-data:/minio_data"]
  milvus:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on: [etcd, minio]
    ports: ["19530:19530", "9091:9091"]
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports: ["9876:9876"]
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on: [rocketmq-namesrv]
    ports: ["10911:10911", "10909:10909"]
volumes: { mysql-data: {}, etcd-data: {}, minio-data: {} }
