<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Java Coding Agent</title>
  <script>
    (() => {
      let preference = 'system';
      try { preference = localStorage.getItem('agentTheme') || 'system'; } catch (error) { /* Storage may be disabled. */ }
      if (!['light', 'dark', 'system'].includes(preference)) preference = 'system';
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作区侧栏">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-icon" aria-hidden="true">⌘</span><span>Java Coding Agent</span></div>
        <div class="workspace-label">本地工作区</div>
      </div>
      <div class="sidebar-content">
        <section class="side-section" aria-labelledby="repositories-title">
          <div class="section-heading"><h2 id="repositories-title">仓库</h2><span id="repository-count" class="count">0</span></div>
          <div id="repositories" class="repository-list"><p class="sidebar-empty">登录后查看仓库</p></div>
        </section>
        <section id="add-repository-panel" class="side-section add-repository" aria-labelledby="add-repository-title" hidden>
          <h2 id="add-repository-title">添加本地仓库</h2>
          <form id="repository-form">
            <label for="repository-name">名称</label><input id="repository-name" name="name" placeholder="例如 sample-user-service" required>
            <label for="workspace-path">绝对路径</label><input id="workspace-path" name="workspacePath" placeholder="C:\mycode\project" required>
            <button class="secondary-button" type="submit">添加仓库</button>
          </form>
        </section>
      </div>
      <div class="sidebar-bottom">
        <label class="theme-control" for="theme-select"><span>界面主题</span><select id="theme-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <div class="service-status"><span class="status-dot" aria-hidden="true"></span><span id="health">检查服务中</span></div>
        <a class="docs-link" href="/swagger-ui.html">API 文档 <span aria-hidden="true">↗</span></a>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb"><span>工作区</span><span class="chevron" aria-hidden="true">/</span><strong id="active-repository">新任务</strong></div>
        <div class="topbar-session"><span class="offline-tag"><span class="tag-dot" aria-hidden="true"></span><span id="runtime-mode">检查运行模式</span></span><span id="session" hidden><span class="avatar" aria-hidden="true">A</span><button id="logout" class="logout-button" type="button">退出</button></span></div>
      </header>
      <main class="workspace">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <section id="login-panel" class="login-panel" aria-labelledby="login-title">
          <div class="login-copy"><span class="eyebrow">LOCAL WORKSPACE</span><h1 id="login-title">进入编程工作区</h1><p>使用本地管理员账号登录，管理仓库并查看任务执行过程。</p></div>
          <form id="login-form" class="login-form">
            <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required>
            <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="primary-button" type="submit">登录工作区 <span aria-hidden="true">→</span></button>
          </form>
        </section>
        <section id="task-workspace" class="task-workspace" aria-labelledby="workspace-title" hidden>
          <div class="workspace-intro"><span class="eyebrow">CODING WORKSPACE</span><h1 id="workspace-title">开始一个任务</h1><p id="runtime-description">选择仓库并描述任务，查看代码分析、执行进度与测试结果。</p></div>
          <form id="task-form" class="composer">
            <label class="sr-only" for="requirement">任务描述</label><textarea id="requirement" name="requirement" rows="4" placeholder="描述你希望检查的代码任务…" required></textarea>
            <div class="composer-footer"><label class="repo-select" for="repository-id"><span class="folder-icon" aria-hidden="true">▱</span><select id="repository-id" name="repositoryId" required><option value="">选择仓库</option></select></label><button class="send-button" type="submit">启动任务 <span aria-hidden="true">↑</span></button></div>
          </form>
          <p id="runtime-hint" class="composer-hint">提交前请确认目标仓库。</p>
          <section class="activity" aria-labelledby="activity-title">
            <div class="activity-heading"><div><span class="eyebrow">ACTIVITY</span><h2 id="activity-title">执行过程</h2></div><button id="refresh-task" class="refresh-button" type="button" hidden>刷新轨迹</button></div>
            <div id="task-empty" class="activity-empty"><span class="empty-icon" aria-hidden="true">⌁</span><strong>还没有任务</strong><p>提交任务后，状态与轨迹会显示在这里。</p></div>
            <div id="task-result" hidden><div class="task-summary"><div><div class="task-caption">当前任务 <span id="task-id"></span></div><p id="task-requirement"></p></div><span id="task-status" class="badge" role="status" aria-live="polite"></span></div><p id="task-outcome" class="task-outcome" hidden></p><div id="trace" class="timeline"></div></div>
          </section>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
